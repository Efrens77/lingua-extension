<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lingua</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Lingua tools"></nav>

  <main id="panels"></main>

  <footer class="app-footer">
    <button type="button" class="settings-button" id="settings-button" aria-expanded="false" aria-controls="settings-sheet">⚙ <span>Settings</span></button>
  </footer>

  <section class="settings-sheet" id="settings-sheet" role="dialog" aria-modal="false" aria-labelledby="settings-title" hidden>
    <div class="settings-head"><h2 id="settings-title">Settings</h2><button type="button" class="icon-btn" id="settings-close" aria-label="Close settings">×</button></div>
    <div class="settings-field settings-language-field">
      <div class="settings-field-head">
        <span id="interface-language-label">Interface language</span>
        <span class="settings-download" id="definition-download" hidden>
          <button type="button" id="definition-download-button">Download</button>
          <span id="definition-download-status" role="status" aria-live="polite"></span>
        </span>
      </div>
      <select id="interface-language" aria-labelledby="interface-language-label"></select>
    </div>
    <label class="settings-field"><span id="text-size-label">Text size</span><input id="text-size" type="range" min="0.8" max="1.4" step="0.01" value="1" /><span class="size-labels"><span id="smaller-label">Smaller</span><span id="larger-label">Larger</span></span></label>
    <div class="settings-actions"><button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">Dark mode</button></div>
    <a id="feedback-link" href="#" target="_blank" rel="noopener">Send feedback</a>
  </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
